# Builds the Windows installer (Blazma-AI-Setup-<version>.exe) on Windows.
# - Run it by hand from the Actions tab: the installer is attached to the run.
# - Push a tag like v0.1.0, or run it by hand with "release" ticked: the
#   installer is also uploaded to a DRAFT GitHub release (notes from
#   docs/releases/v<version>.md), which stays private until someone publishes it.
#   Running it again updates that draft (files replaced, commit and notes
#   updated); a release that is already published is never changed.
# - With "publish" ticked too, the draft is published after it is updated.
name: Windows installer

on:
  workflow_dispatch:
    inputs:
      release:
        description: Create a draft release v<version> at this commit with the installer
        type: boolean
        default: false
      publish:
        description: Then publish that release (makes it public and the latest)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer
        run: npx electron-builder --win nsis --x64 --publish never
      # The app runs a downloaded update only with a valid signature from this
      # key (src/main/updates.js has the public half).
      - name: Sign installer
        shell: bash
        run: |
          printf '%s' "$BLAZMA_UPDATE_KEY" > key.pem
          for f in dist/*.exe; do node -e "const c=require('crypto'),fs=require('fs');fs.writeFileSync(process.argv[1]+'.sig',c.sign(null,fs.readFileSync(process.argv[1]),c.createPrivateKey(fs.readFileSync('key.pem'))).toString('base64'))" "$f"; done
          rm key.pem
          ls dist
        env:
          BLAZMA_UPDATE_KEY: ${{ secrets.BLAZMA_UPDATE_KEY }}
      - name: Release from tag
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "v$VERSION" dist/*.exe dist/*.exe.sig dist/*.exe.blockmap dist/latest.yml --draft --title "Blazma AI $VERSION" --notes-file "docs/releases/v$VERSION.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Draft release
        if: ${{ inputs.release }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          FILES="dist/*.exe dist/*.exe.sig dist/*.exe.blockmap dist/latest.yml"
          # latest.yml and the blockmap let the app update itself (electron-updater).
          DRAFT=$(gh release view "v$VERSION" --json isDraft -q .isDraft 2>/dev/null || echo none)
          if [ "$DRAFT" = none ]; then
            gh release create "v$VERSION" $FILES --draft --target "$GITHUB_SHA" --title "Blazma AI $VERSION" --notes-file "docs/releases/v$VERSION.md"
          elif [ "$DRAFT" = true ]; then
            gh release edit "v$VERSION" --target "$GITHUB_SHA" --title "Blazma AI $VERSION" --notes-file "docs/releases/v$VERSION.md"
            gh release upload "v$VERSION" $FILES --clobber
          else
            echo "::error::v$VERSION is already published; raise the version in package.json first."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish release
        if: ${{ inputs.release && inputs.publish }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "v$VERSION" --draft=false --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: Blazma-AI-Setup
          path: |
            dist/*.exe
            dist/*.exe.sig
            dist/latest.yml
          if-no-files-found: error
